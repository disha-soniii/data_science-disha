<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Insurance Charge Predictor</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">Insurance Predictor</a>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center">Insurance Charge Prediction</h2>
    <form action="{{ url_for('predict') }}" method="post">
        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Sex</label>
            <select name="sex" class="form-control" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>

        <div class="form-group">
            <label>BMI</label>
            <input type="number" step="0.1" name="bmi" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Children</label>
            <input type="number" name="children" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Smoker</label>
            <select name="smoker" class="form-control" required>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Region</label>
            <select name="region" class="form-control" required>
                <option value="southwest">Southwest</option>
                <option value="southeast">Southeast</option>
                <option value="northwest">Northwest</option>
                <option value="northeast">Northeast</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Predict Charge</button>
    </form>

    {% if prediction %}
    <div class="alert alert-success mt-4 text-center">
        <h4>Predicted Insurance Charge: ₹{{ prediction }}</h4>
    </div>
    {% endif %}
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    &copy; 2025 Insurance Predictor. All rights reserved.
</footer>
</body>
</html>
