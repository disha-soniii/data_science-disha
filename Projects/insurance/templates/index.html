<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Insurance Price Predictor</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url("{{ url_for('static', filename='insurance.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            height: 100vh;
            color: white;
        }

        header {
            background-color: #333;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        section {
            margin: 40px auto;
            max-width: 800px;
            background-color: rgba(0,0,0,0.7);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        section h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        section p {
            font-size: 18px;
            line-height: 1.6;
        }

        .buttonGroup {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 30px;
        }

        .buttonGroup a button {
            font-size: 18px;
            padding: 15px 25px;
            border-radius: 10px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .buttonGroup a button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<header>
    <h1>Insurance Price Predictor</h1>
</header>

<section>
    <h2>Predict Your Insurance Premium Instantly</h2>
    <p>
        Welcome to the Insurance Price Prediction Tool. Just enter your personal details and lifestyle information, and we’ll instantly predict your insurance premium!
    </p>

    <div class="buttonGroup">
        <a href="{{ url_for('predict') }}">
            <button>Predict Insurance Price</button>
        </a>
        <a href="{{ url_for('about') }}">
            <button>About Project</button>
        </a>
    </div>
</section>

</body>
</html>
