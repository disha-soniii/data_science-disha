<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Price Predictor</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Laptop Predictor</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/about">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/contact">Contact</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/history">History</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center">Laptop Price Prediction</h2>
        <form action="{{ url_for('predict') }}" method="post">
            <div class="form-group">
                <label for="brand_name">Brand</label>
                <select class="form-control" name="brand_name" required>
                    <option>ASUS</option>
                    <option>Lenovo</option>
                    <option>acer</option>
                    <option>Avita</option>
                    <option>HP</option>
                    <option>DELL</option>
                    <option>MSI</option>
                    <option>APPLE</option>
                </select>
            </div>

            <div class="form-group">
                <label for="processor_brand">Processor Brand</label>
                <select class="form-control" name="processor_brand" required>
                    <option>Intel</option>
                    <option>AMD</option>
                    <option>M1</option>
                </select>
            </div>

            <div class="form-group">
                <label for="processor_name">Processor Name</label>
                <select class="form-control" name="processor_name" required>
                    <option>Celeron Dual</option>
                    <option>Core i3</option>
                    <option>Core i5</option>
                    <option>Core i7</option>
                    <option>Core i9</option>
                    <option>M1</option>
                    <option>Pentium Quad</option>
                    <option>Ryzen 3</option>
                    <option>Ryzen 5</option>
                    <option>Ryzen 7</option>
                    <option>Ryzen 9</option>
                </select>
            </div>

            <div class="form-group">
                <label for="processor_gnrtn">Processor Generation</label>
                <select class="form-control" name="processor_gnrtn" required>
                    <option>4th</option>
                    <option>7th</option>
                    <option>8th</option>
                    <option>9th</option>
                    <option>10th</option>
                    <option>11th</option>
                    <option>12th</option>
                    <option>Not Available</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ram_gb">RAM (GB)</label>
                <select class="form-control" name="ram_gb" required>
                    <option>4 GB</option>
                    <option>8 GB</option>
                    <option>16 GB</option>
                    <option>32 GB</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ram_type">RAM Type</label>
                <select class="form-control" name="ram_type" required>
                    <option>DDR3</option>
                    <option>DDR4</option>
                    <option>DDR5</option>
                    <option>LPDDR3</option>
                    <option>LPDDR4</option>
                    <option>LPDDR4X</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ssd">SSD</label>
                <select class="form-control" name="ssd" required>
                    <option>0 GB</option>
                    <option>128 GB</option>
                    <option>256 GB</option>
                    <option>512 GB</option>
                    <option>1024 GB</option>
                    <option>2048 GB</option>
                    <option>3072 GB</option>
                </select>
            </div>

            <div class="form-group">
                <label for="hdd">HDD</label>
                <select class="form-control" name="hdd" required>
                    <option>0 GB</option>
                    <option>512 GB</option>
                    <option>1024 GB</option>
                    <option>2048 GB</option>
                </select>
            </div>

            <div class="form-group">
                <label for="os">Operating System</label>
                <select class="form-control" name="os" required>
                    <option>Windows</option>
                    <option>DOS</option>
                    <option>Mac</option>
                </select>
            </div>

            <div class="form-group">
                <label for="os_bit">OS Bit</label>
                <select class="form-control" name="os_bit" required>
                    <option>32 bit</option>
                    <option>64 bit</option>
                </select>
            </div>

            <div class="form-group">
                <label for="graphic_card_gb">Graphic Card</label>
                <select class="form-control" name="graphic_card_gb" required>
                    <option>0 GB</option>
                    <option>2 GB</option>
                    <option>4 GB</option>
                    <option>6 GB</option>
                    <option>8 GB</option>
                </select>
            </div>

            <div class="form-group">
                <label for="warranty">Warranty</label>
                <select class="form-control" name="warranty" required>
                    <option>No warranty</option>
                    <option>1 year</option>
                    <option>2 years</option>
                    <option>3 years</option>
                </select>
            </div>

            <label for="Touchscreen">Touchscreen</label>
            <select name="Touchscreen" id="fifth" required="required">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
            <br><br>

            <label for="msoffice">MS Office</label>
            <select name="msoffice" id="fifth" required="required">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
            <br><br>

            <button type="submit" class="btn btn-primary">Predict Price</button>
        </form>

        {% if prediction %}
        <div class="alert alert-success mt-4 text-center">
            <h4>Predicted Laptop Price: ₹{{ prediction }}</h4>
        </div>
        {% endif %}
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        &copy; 2025 Laptop Price Prediction. All rights reserved.
    </footer>
</body>
</html>
