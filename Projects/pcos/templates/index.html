<!DOCTYPE html>
<html lang="en">
<head>

    <title>PCOS Predictor Homepage</title>
    <style>
        body {
            margin: 0;

            background-position: center;

            background-repeat: no-repeat;
            height: 100vh;

        header {

        .buttonGroup {
