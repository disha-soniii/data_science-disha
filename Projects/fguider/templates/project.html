<!DOCTYPE html>
<html lang="en">
<head>
    <title>Farmer Guider - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <a class="navbar-brand" href="/">Farmer Guider</a>
    <div class="ml-auto">
        <a class="nav-link text-white" href="/about">About</a>
        <a class="nav-link text-white" href="/contact">Contact</a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center mb-4">🌾 Farmer Guider - Predict Your Best Crop</h2>
    <form action="/predict" method="POST">
        <div class="form-group"><label>Nitrogen (N):</label><input type="number" name="n" step="any" class="form-control" required></div>
        <div class="form-group"><label>Phosphorus (P):</label><input type="number" name="p" step="any" class="form-control" required></div>
        <div class="form-group"><label>Potassium (K):</label><input type="number" name="k" step="any" class="form-control" required></div>
        <div class="form-group"><label>Temperature (°C):</label><input type="number" name="temperature" step="any" class="form-control" required></div>
        <div class="form-group"><label>Humidity (%):</label><input type="number" name="humidity" step="any" class="form-control" required></div>
        <div class="form-group"><label>pH Value:</label><input type="number" name="ph" step="any" class="form-control" required></div>
        <div class="form-group"><label>Rainfall (mm):</label><input type="number" name="rainfall" step="any" class="form-control" required></div>
        <button class="btn btn-success btn-block">Predict Crop</button>
    </form>
</div>

<footer class="bg-success text-white text-center py-3 mt-5">&copy; 2025 Farmer Guider</footer>

</body>
</html>
